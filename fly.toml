# Fly.io: a public wss:// endpoint for Dial.
#   fly launch --no-deploy --copy-config   (pick an app name; this file uses deskless-os)
#   fly volumes create notes --size 1 -r fra
#   fly secrets set FISH_AUDIO_API_KEY=… FISH_VOICE=… GEMINI_MODEL=gemini-3.5-flash \
#     GOOGLE_CLOUD_PROJECT=… GOOGLE_SERVICE_ACCOUNT_JSON="$(base64 -w0 sa.json)" \
#     DIAL_SIGNING_SECRET=… DEV_TOKEN=…
#   (or GEMINI_BACKEND=studio GEMINI_API_KEY=… instead of the Vertex pair)
#   fly deploy
#   npm run dial -- activate wss://deskless-os.fly.dev/dial

app = "deskless-os"
primary_region = "fra"

[build]

[env]
  PORT = "8787"
  NOTES_DIR = "/data/notes"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"   # a phone call must never wait for a cold start
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "notes"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
